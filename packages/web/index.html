<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inkmap</title>
</head>
<body>
  <header id="bar">
    <button id="undo" class="icon-btn" data-i18n-title="undoTitle" aria-label="Undo">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 6.5h6a3.5 3.5 0 1 1 0 7H7"/><path d="M6 4 3.5 6.5 6 9"/></svg>
    </button>
    <button id="redo" class="icon-btn" data-i18n-title="redoTitle" aria-label="Redo">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 6.5h-6a3.5 3.5 0 1 0 0 7H9"/><path d="M10 4l2.5 2.5L10 9"/></svg>
    </button>
    <span class="sep"></span>
    <select id="level-select" data-i18n-title="expandToTitle">
      <option value="" hidden data-i18n="expandTo"></option>
      <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="all" data-i18n="all"></option>
    </select>
    <button id="fit" data-i18n-title="fitTitle">
      <svg class="bar-icon" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6V3.5a1 1 0 0 1 1-1H6M10 2.5h2.5a1 1 0 0 1 1 1V6M13.5 10v2.5a1 1 0 0 1-1 1H10M6 13.5H3.5a1 1 0 0 1-1-1V10"/></svg>
      <span data-i18n="fit"></span>
    </button>
    <span class="sep"></span>
    <select id="layout-select" data-i18n-title="layout"></select>
    <select id="theme-select" data-i18n-title="theme"></select>
    <span class="sep"></span>
    <button id="find" data-i18n-title="findTitle">
      <svg class="bar-icon" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7.2" cy="7.2" r="4.5"/><path d="m10.6 10.6 3 3"/></svg>
      <span data-i18n="find"></span>
    </button>
    <span class="dropdown">
      <button id="export">
        <svg class="bar-icon" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.5v7.5M5 7l3 3 3-3"/><path d="M2.5 11.5v1a1.5 1.5 0 0 0 1.5 1.5h8a1.5 1.5 0 0 0 1.5-1.5v-1"/></svg>
        <span data-i18n="export"></span>
      </button>
      <span id="export-menu" class="menu" hidden>
        <button data-export="png" data-i18n="exportPng"></button>
        <button data-export="svg" data-i18n="exportSvg"></button>
        <button data-export="html" data-i18n="exportHtml"></button>
      </span>
    </span>
    <button id="present" data-i18n-title="presentTitle">
      <svg class="bar-icon" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2.8" width="12" height="8.4" rx="1.4"/><path d="M6.8 5.4 10 7l-3.2 1.6V5.4Z"/><path d="M8 11.2v2.3M5.5 13.5h5"/></svg>
      <span data-i18n="present"></span>
    </button>
    <span id="status" data-state="saved"></span>
    <div id="account">
      <button id="pro" type="button" aria-expanded="false" aria-controls="account-panel" hidden>
        <span class="account-avatar" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="5.5" r="2.6"/><path d="M3.2 13.4c.7-2.2 2.5-3.4 4.8-3.4s4.1 1.2 4.8 3.4"/></svg></span>
        <span id="account-badge"></span>
      </button>
      <section id="account-panel" aria-labelledby="account-heading" hidden>
        <div class="account-identity">
          <span class="account-avatar" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="5.5" r="2.6"/><path d="M3.2 13.4c.7-2.2 2.5-3.4 4.8-3.4s4.1 1.2 4.8 3.4"/></svg></span>
          <div class="account-identity-meta">
            <p id="account-text"></p>
            <h2 id="account-heading" data-i18n="accountHeading"></h2>
          </div>
        </div>
        <div class="account-plan">
          <div id="account-plan-status" class="account-plan-status">
            <div class="account-plan-head">
              <span class="account-plan-dot" aria-hidden="true"></span>
              <strong id="account-plan-title"></strong>
            </div>
            <p id="account-plan-detail"></p>
          </div>
          <div id="account-perks" class="account-perks" hidden>
            <div class="account-perks-head">
              <span class="account-perks-label"><span class="pro-mini-badge">PRO</span><span data-i18n="proPerksTitle"></span></span>
              <span class="account-perks-price" data-i18n="proPriceTag"></span>
            </div>
            <ul class="account-perks-list">
              <li data-i18n="perk.markdown"></li>
              <li data-i18n="perk.diagram"></li>
              <li data-i18n="perk.layouts"></li>
              <li data-i18n="perk.export"></li>
              <li data-i18n="perk.rich"></li>
              <li data-i18n="perk.present"></li>
              <li data-i18n="perk.updates"></li>
            </ul>
          </div>
        </div>
        <div class="account-primary">
          <button id="account-buy" class="buy" type="button" data-i18n="buyPro" hidden></button>
          <button id="account-sign-in" class="buy" type="button" data-i18n="signIn" hidden></button>
        </div>
        <div id="account-actions" class="account-actions" hidden>
          <button id="switch-account" class="account-menu-item" type="button"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 2.5 13.5 5 11 7.5"/><path d="M2.5 5h11"/><path d="M5 13.5 2.5 11 5 8.5"/><path d="M13.5 11h-11"/></svg><span data-i18n="switchAccount"></span></button>
          <button id="sign-out" class="account-menu-item danger" type="button"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2.5H3.8A1.3 1.3 0 0 0 2.5 3.8v8.4c0 .72.58 1.3 1.3 1.3H6"/><path d="M10.5 11 13.5 8l-3-3"/><path d="M13.5 8H6.5"/></svg><span data-i18n="signOut"></span></button>
        </div>
        <div id="account-phone-slot"></div>
        <p id="account-message" class="billing-message" role="status" hidden></p>
      </section>
    </div>
  </header>

  <div id="search" hidden>
    <input id="find-input" data-i18n-placeholder="findPlaceholder" spellcheck="false">
    <span id="find-count"></span>
    <button id="find-prev" data-i18n-title="prev">↑</button>
    <button id="find-next" data-i18n-title="next">↓</button>
    <span class="sep"></span>
    <input id="replace-input" data-i18n-placeholder="replacePlaceholder" spellcheck="false">
    <button id="replace-one" data-i18n="replace"></button>
    <button id="replace-all" data-i18n="replaceAll"></button>
    <button id="find-close" class="icon" data-i18n-title="close">×</button>
  </div>

  <main id="map"></main>
  <textarea id="node-inline-edit" rows="1" spellcheck="false" hidden></textarea>

  <aside id="source" hidden>
    <div class="source-head">
      <span data-i18n="sourceHead"></span>
      <button id="close-source" data-i18n-title="close">×</button>
    </div>
    <textarea id="source-text" spellcheck="false" data-i18n-placeholder="sourcePlaceholder"></textarea>
    <p class="source-hint" data-i18n="sourceHint"></p>
  </aside>

  <button id="chat-add" hidden></button>

  <div id="node-menu" class="menu" hidden>
    <button id="menu-add-to-chat" hidden></button>
    <button id="menu-insert-child"><span data-i18n="insertChildNode"></span><kbd>Tab</kbd></button>
    <button id="menu-insert-sibling"><span data-i18n="insertSiblingNode"></span><kbd>Enter</kbd></button>
    <button id="menu-insert-parent"><span data-i18n="insertParentNode"></span><kbd>⇧Tab</kbd></button>
    <button id="menu-move-up"><span data-i18n="moveNodeUp"></span><kbd id="menu-up-kbd">⌘↑</kbd></button>
    <button id="menu-move-down"><span data-i18n="moveNodeDown"></span><kbd id="menu-down-kbd">⌘↓</kbd></button>
    <button id="menu-source"><span data-i18n="editMarkdown"></span><kbd id="menu-source-kbd">⌘E</kbd></button>
    <button id="menu-expand-subtree"><span data-i18n="expandAllDescendants"></span><kbd>⇧/</kbd></button>
    <button id="menu-remove-node"><span data-i18n="removeNode"></span><kbd>⌫</kbd></button>
  </div>

  <div id="upgrade" hidden>
    <div class="upgrade-card" role="dialog" aria-modal="true" aria-labelledby="upgrade-title">
      <button class="upgrade-close" data-i18n-title="close">×</button>
      <div class="upgrade-head">
        <span class="pro-pill">PRO</span>
        <h2 id="upgrade-title" data-i18n="proTitle"></h2>
      </div>
      <p class="upgrade-sub" data-i18n="proSubtitle"></p>
      <p id="trial-status" hidden></p>
      <p id="trial-expired-message" data-i18n="trialExpired" hidden></p>
      <p class="upgrade-locked" hidden></p>
      <p id="upgrade-account" hidden></p>
      <ul class="upgrade-features"></ul>
      <div class="upgrade-buy">
        <button id="buy-pro" class="buy" type="button" data-i18n="buyPro" hidden></button>
        <button id="upgrade-sign-in" class="buy" type="button" data-i18n="signIn" hidden></button>
      </div>
      <div id="upgrade-account-actions" class="account-actions" hidden>
        <button id="upgrade-switch-account" class="link-btn" type="button" data-i18n="switchAccount"></button>
        <button id="upgrade-sign-out" class="link-btn danger" type="button" data-i18n="signOut"></button>
      </div>
      <div id="upgrade-phone-slot"></div>
      <p id="checkout-msg" class="billing-message" role="status" hidden></p>
    </div>
  </div>

  <template id="phone-sign-in-template">
    <form class="phone-sign-in" aria-labelledby="phone-sign-in-title">
      <div class="phone-sign-in-head">
        <div class="phone-sign-in-brand">
          <span class="phone-sign-in-badge" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.8" y="3.2" width="12.4" height="9.6" rx="2"/><path d="m2.5 4.4 5.5 4 5.5-4"/></svg>
          </span>
          <div>
            <h3 id="phone-sign-in-title" data-i18n="phoneSignIn"></h3>
            <p class="phone-sign-in-sub" data-i18n="phoneSignInSub"></p>
          </div>
        </div>
        <button id="cancel-phone-sign-in" type="button" class="phone-sign-in-close" data-i18n-title="close" aria-label="Close">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4.2 4.2l7.6 7.6M11.8 4.2l-7.6 7.6"/></svg>
        </button>
      </div>
      <div class="phone-field">
        <label for="sign-in-phone" data-i18n="phoneNumber"></label>
        <div class="phone-code-row phone-email-row">
          <svg class="phone-input-icon" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.8" y="3.2" width="12.4" height="9.6" rx="1.8"/><path d="m2.4 4.2 5.6 4.2 5.6-4.2"/></svg>
          <input id="sign-in-phone" type="text" inputmode="email" autocomplete="email" maxlength="254" required data-i18n-placeholder="phonePlaceholder">
          <button id="send-phone-code" type="button"></button>
        </div>
      </div>
      <div class="phone-field">
        <label for="sign-in-code" data-i18n="phoneCode"></label>
        <input id="sign-in-code" class="phone-code-input" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required data-i18n-placeholder="phoneCodePlaceholder">
      </div>
      <p id="phone-sign-in-status" class="billing-message" role="status" aria-live="polite" hidden></p>
      <button class="buy" type="submit" data-i18n="phoneVerifySubmit"></button>
      <p class="phone-sign-in-hint" data-i18n="phoneSignInHint"></p>
    </form>
  </template>

  <template id="wechat-pay-template">
    <section class="wechat-pay" aria-labelledby="wechat-pay-title">
      <div class="wechat-pay-head">
        <div class="wechat-pay-brand">
          <span class="wechat-pay-icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M10 1.8 3.2 4.6v4.9c0 4.4 2.9 7.8 6.8 8.7 3.9-.9 6.8-4.3 6.8-8.7V4.6L10 1.8Z" fill="currentColor" fill-opacity=".18" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="m7.2 10.1 2 2 3.8-3.9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <div>
            <h3 id="wechat-pay-title" data-i18n="wechatPayTitle"></h3>
            <p class="wechat-pay-sub" data-i18n="wechatPaySub"></p>
          </div>
        </div>
        <button id="close-wechat-pay" type="button" class="phone-sign-in-close" data-i18n-title="close" aria-label="Close">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4.2 4.2l7.6 7.6M11.8 4.2l-7.6 7.6"/></svg>
        </button>
      </div>
      <div class="wechat-pay-meta">
        <div class="wechat-pay-meta-info">
          <span class="wechat-pay-product"><span class="pro-mini-badge">PRO</span><span data-i18n="wechatPayProduct"></span></span>
          <span id="wechat-pay-account" class="wechat-pay-account" hidden></span>
        </div>
        <strong id="wechat-pay-amount" class="wechat-pay-amount"></strong>
      </div>
      <div id="wechat-pay-stage" class="wechat-pay-stage">
        <img id="wechat-pay-qr" width="168" height="168" alt="WeChat Pay QR code">
        <div id="wechat-pay-expired" class="wechat-pay-expired" hidden>
          <span data-i18n="wechatPayExpired"></span>
          <button id="refresh-wechat-pay" type="button" class="wechat-refresh-btn" data-i18n="wechatPayRefresh"></button>
        </div>
      </div>
      <div id="card-pay-stage" class="card-pay-stage" hidden>
        <button id="card-pay-btn" type="button" class="buy" data-i18n="cardPayBtn"></button>
      </div>
      <div class="wechat-pay-status">
        <span class="wechat-pay-dot" aria-hidden="true"></span>
        <span id="wechat-pay-expires"></span>
      </div>
      <p class="wechat-pay-note" data-i18n="wechatPayNote"></p>
    </section>
  </template>

  <div id="present-bar" hidden>
    <button id="present-prev" type="button" data-i18n="presentPrev"></button>
    <span id="present-step"></span>
    <button id="present-next" type="button" data-i18n="presentNext"></button>
    <span class="sep"></span>
    <button id="present-exit" type="button" data-i18n="presentExit"></button>
  </div>

  <div id="diagram-modal" hidden>
    <div class="diagram-modal-bar">
      <button id="diagram-zoom-out" type="button" title="−">−</button>
      <span id="diagram-zoom-level">100%</span>
      <button id="diagram-zoom-in" type="button" title="+">+</button>
      <button id="diagram-zoom-fit" type="button" data-i18n="fit"></button>
      <button id="diagram-zoom-reset" type="button">100%</button>
      <button id="diagram-modal-close" type="button" data-i18n-title="close">×</button>
    </div>
    <p id="diagram-modal-hint" data-i18n="diagramHint"></p>
    <div id="diagram-modal-stage" tabindex="0">
      <div id="diagram-modal-world">
        <img id="diagram-modal-img" alt="Mermaid" draggable="false">
      </div>
    </div>
  </div>

  <div id="toast" hidden></div>
  <script type="module" src="./src/entry.ts"></script>
</body>
</html>
