<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inkmap</title>
</head>
<body>
  <header id="bar">
    <strong id="doc-name">Inkmap</strong>
    <span class="sep"></span>
    <button id="undo" title="撤销 ⌘Z">撤销</button>
    <button id="redo" title="重做 ⇧⌘Z">重做</button>
    <span class="sep"></span>
    <span class="label">展开到</span>
    <button data-level="1">1</button><button data-level="2">2</button><button data-level="3">3</button><button data-level="4">4</button><button data-level="all">全部</button>
    <button id="expand-subtree" title="展开选中节点的所有子孙节点 ⇧/">展开子孙</button>
    <button id="fit" title="适应窗口">适应窗口</button>
    <span class="sep"></span>
    <button id="toggle-source" title="编辑选中节点的 Markdown 源码 ⌘E">源码</button>
    <span id="status" data-state="saved">已保存</span>
  </header>
  <main id="map"></main>
  <aside id="source" hidden>
    <div class="source-head">
      <span>节点 Markdown</span>
      <button id="close-source" title="关闭">×</button>
    </div>
    <textarea id="source-text" spellcheck="false" placeholder="先选中一个节点"></textarea>
    <p class="source-hint">修改即时生效并写回文件。表格、图片、多行内容在这里编辑；普通文字也可以在图上双击编辑。</p>
  </aside>
  <div id="node-menu" hidden>
    <button id="menu-expand-subtree">展开所有子孙节点<kbd>⇧/</kbd></button>
  </div>
  <div id="toast" hidden></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
